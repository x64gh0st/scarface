[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scarface-scanner"
version = "3.0.0"
description = "Scanner de portas TCP em Python, inspirado no nmap: descoberta de hosts, escaneamento, identificação de serviços e banners. Sem dependências."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Pedro Henrique Almeida" }
]
keywords = ["port-scanner", "nmap", "network", "security", "pentest", "cybersecurity", "banner-grabbing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build", "twine"]

[project.scripts]
scarface = "scarface:main"

[project.urls]
Repository = "https://github.com/x64gh0st/scarface"
Changelog = "https://github.com/x64gh0st/scarface/blob/main/CHANGELOG.md"
Issues = "https://github.com/x64gh0st/scarface/issues"

[tool.setuptools]
py-modules = ["scarface"]

[tool.pytest.ini_options]
testpaths = ["test_scarface.py"]
