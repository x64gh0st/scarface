name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instala
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Testes
        run: pytest -v
      - name: Teste de fumaça (scan em localhost)
        run: python scarface.py 127.0.0.1 -p 1-100 --sem-cor
      - name: Build do pacote
        run: |
          python -m build
          twine check dist/*
